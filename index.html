<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style><link rel="icon" type="image/png" href="logo-192.png"><link rel="apple-touch-icon" href="logo-512.png"><meta name="theme-color" content="#1F3B57"><meta property="og:type" content="website"><meta property="og:site_name" content="Medical Companion"><meta property="og:title" content="First Aid MCQ Bank · Medical Companion"><meta property="og:description" content="Free exam-style MCQs for every section of First Aid for the USMLE Step 1 2026, by Medical Companion. Explanations for every option, progress tracker, flags and USMLE-style mock exams."><meta property="og:url" content="https://medicalcompanion.github.io/"><meta property="og:image" content="https://medicalcompanion.github.io/logo-512.png"><meta name="twitter:card" content="summary">
<title>First Aid MCQ Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free exam-style MCQs for every section of First Aid for the USMLE Step 1 2026, by Medical Companion. Explanations for every option, progress tracker, flags and USMLE-style mock exams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<style>
/* Layout: a shelf of system folders (thumb-tab colours like the book) → folder of subject files → one-question exam panel */
:root{
  --paper:#EDF1F3; --card:#FFFFFF; --card-2:#F5F7F8; --ink:#13202B; --muted:#56656F; --rule:#D3DBE0;
  --ok:#1C7A4B; --ok-soft:#E0F2E7; --bad:#C2410C; --bad-soft:#FCEBDD; --focus:#1B6FD1;
  --lift:0%; --shadow:0 1px 2px rgba(19,32,43,.06),0 6px 20px rgba(19,32,43,.06);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sys:#2D4A9A;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1318; --card:#151D24; --card-2:#1A242C; --ink:#E3EAEE; --muted:#97A6B0; --rule:#29353F;
  --ok:#4DC48B; --ok-soft:#12301F; --bad:#F2924F; --bad-soft:#3A2314; --focus:#7DB3FF;
  --lift:40%; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1318; --card:#151D24; --card-2:#1A242C; --ink:#E3EAEE; --muted:#97A6B0; --rule:#29353F;
  --ok:#4DC48B; --ok-soft:#12301F; --bad:#F2924F; --bad-soft:#3A2314; --focus:#7DB3FF;
  --lift:40%; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.tint{--acc:color-mix(in oklab,var(--sys),white var(--lift));--acc-soft:color-mix(in oklab,var(--acc) 13%,var(--card));--acc-line:color-mix(in oklab,var(--acc) 35%,var(--rule))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto}
.skip{position:absolute;left:-999px}
.skip:focus{left:16px;top:8px;background:var(--card);padding:8px 12px;z-index:20}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklab,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));min-height:52px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.01em;min-width:0}
.brand .mark{display:grid;grid-template-columns:repeat(3,6px);gap:2px}
.brand .mark i{width:6px;height:14px;border-radius:2px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--muted);min-width:0;flex:1}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs .here{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.5}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:var(--acc,var(--ink));border-color:transparent;color:#fff}
:root[data-theme="dark"] .btn.solid{color:#0D1318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.solid{color:#0D1318}}
.btn[disabled]{opacity:.45;cursor:default}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rule);border:1px solid var(--muted)}
.sync[data-state="synced"]::before{background:var(--ok);border-color:var(--ok)}
.sync[data-state="syncing"]::before{background:var(--acc,var(--focus));border-color:transparent}
.sync[data-state="error"]::before{background:var(--bad);border-color:var(--bad)}

/* type */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.2vw,28px);line-height:1.2}
.lead{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* hero */
.hero{display:grid;gap:14px;padding-block:40px 28px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--card)}

/* continue */
.continue{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--acc-line);border-radius:14px;padding:14px 16px;text-decoration:none;box-shadow:var(--shadow)}
.continue .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.continue .t{font-weight:600;flex:1;min-width:0}

/* shelf of folders */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 14px;padding-top:14px;border-top:1px solid var(--rule)}
.section-head .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px 16px}
.folder{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--card);border:1px solid var(--rule);border-radius:4px 12px 12px 12px;padding:16px 16px 14px;margin-top:12px;min-height:150px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.folder::before{content:"";position:absolute;left:-1px;top:-13px;height:13px;width:46%;background:var(--card);border:1px solid var(--rule);border-bottom:0;border-radius:8px 14px 0 0}
.folder::after{content:"";position:absolute;left:12px;top:-6px;height:4px;width:calc(46% - 30px);border-radius:3px;background:var(--acc)}
.folder:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--acc-line)}
.folder:hover::before{border-color:var(--acc-line)}
.folder .name{font-family:var(--f-display);font-size:21px;line-height:1.2}
.folder .sub{font-size:13px;color:var(--muted)}
.folder .ff{margin-top:auto;display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--rule)}
.folder .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.folder.dim .name{color:var(--muted)}
.meter{height:5px;border-radius:99px;background:var(--card-2);overflow:hidden;border:1px solid var(--rule)}
.meter i{display:block;height:100%;background:var(--acc);border-radius:99px}
.pill{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 8px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.pill.live{border-color:var(--acc-line);color:var(--acc);background:var(--acc-soft)}

/* folder view (subject files) */
.files{display:grid;gap:10px}
.file{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;text-decoration:none;transition:border-color .15s,box-shadow .15s}
a.file:hover{border-color:var(--acc-line);box-shadow:var(--shadow)}
.file .ic{width:34px;height:42px;border-radius:4px 10px 4px 4px;background:var(--acc-soft);border:1px solid var(--acc-line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--acc);font-weight:500}
.file .t{font-weight:600;font-size:17px}
.file .d{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.file .r{display:grid;justify-items:end;gap:6px;min-width:96px}
.file .r .meter{width:96px}
.file.soon{opacity:.62}
.file > div{min-width:0}

/* quiz */
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.round{display:grid;gap:6px;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer}
.round:hover{border-color:var(--acc-line)}
.round[aria-current="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.round .n{font-family:var(--f-mono);font-size:12px;color:var(--acc);letter-spacing:.08em}
.round .tt{font-size:14px;font-weight:600;line-height:1.3}
.round .st{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.overall{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:12px 0 0}

.panel{background:var(--card);border:1px solid var(--rule);border-radius:16px;margin-top:22px;box-shadow:var(--shadow);scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap;padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.panel-head > div{min-width:0}
.panel-head h2{font-size:22px;margin-top:4px}
.rstat{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:0}
.qmap{border-bottom:1px solid var(--rule);padding:10px 20px}
.qmap summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
.qmap summary::-webkit-details-marker{display:none}
.qmap summary::after{content:"⌄";font-size:16px;line-height:1;transform:translateY(-3px)}
.qmap[open] summary::after{transform:rotate(180deg) translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:10px 0 8px;max-width:520px}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--rule);background:var(--card-2);font-family:var(--f-mono);font-size:12px;cursor:pointer;display:grid;place-items:center;padding:0}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell[aria-current="true"]{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--rule)}
.legend .l-ok{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad{background:var(--bad-soft);border-color:var(--bad)}
.qbody{padding:20px}
.qnum{font-family:var(--f-mono);font-size:12px;color:var(--acc);letter-spacing:.1em;margin:0 0 8px}
.stem{font-size:18px;line-height:1.6;margin:0 0 18px;max-width:68ch}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:start;gap:12px;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--acc);background:var(--acc-soft)}
.opt[disabled]{cursor:default}
.let{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:500;border:1px solid var(--rule);background:var(--card-2)}
.otxt{padding-top:2px;min-width:0}
.mk{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:6px;white-space:nowrap}
.why{display:none;font-size:14.5px;color:var(--muted);line-height:1.55;padding:8px 14px 2px 56px}
.answered .why{display:block}
li.is-ok .opt{border-color:var(--ok);background:var(--ok-soft)}
li.is-ok .let{background:var(--ok);border-color:var(--ok);color:var(--card)}
li.is-ok .mk{color:var(--ok)}
li.is-bad .opt{border-color:var(--bad);background:var(--bad-soft)}
li.is-bad .let{background:var(--bad);border-color:var(--bad);color:var(--card)}
li.is-bad .mk{color:var(--bad)}
li.is-ok .why{color:var(--ink)}
.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--card-2);border:1px solid var(--rule);display:grid;gap:4px}
.feedback .v{font-weight:700}
.feedback .v.ok{color:var(--ok)} .feedback .v.bad{color:var(--bad)}
.feedback .src{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.qnav{display:flex;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--rule)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.summary{padding:26px 20px;display:grid;gap:14px;justify-items:start}
.score{font-family:var(--f-display);font-size:52px;line-height:1}
.score small{font-family:var(--f-mono);font-size:15px;color:var(--muted);margin-left:8px}
.missed{display:flex;flex-wrap:wrap;gap:6px}
.share{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:18px 20px;margin-top:22px}
.share > div{min-width:0}
.share h3{font-family:var(--f-display);font-weight:400;font-size:22px}
.share p{margin:4px 0 0;color:var(--muted);font-size:14px}
.share .acts{display:flex;gap:8px;flex-wrap:wrap}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.about{font-size:13px;color:var(--muted);max-width:75ch;margin:14px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow)}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:16px;padding:28px 20px;margin-top:22px;display:grid;gap:10px;justify-items:start}
.loading{padding:40px 0;color:var(--muted)}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(5,1fr)}
  .file{grid-template-columns:auto 1fr}
  .file .r{grid-column:1 / -1;justify-items:stretch;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px}
  .file .r .pill{justify-self:start}
  .file .r .meter{width:auto}
  .share{grid-template-columns:1fr}
  .stem{font-size:17px}
  .why{padding-left:14px}
  .qbody,.panel-head,.qmap,.qnav{padding-left:16px;padding-right:16px}
  .brand .wordmark{display:none}

.logo{display:inline-block;flex:none;width:34px;height:34px;border-radius:50%;background:var(--logo) center/cover no-repeat}
.brand .wordmark{display:grid;line-height:1.15;font-size:15px}
.brand .wordmark small{font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.bar .wrap{flex-wrap:wrap}
.crumbs:empty{display:none}
.brand{margin-right:auto}
.crumbs:not(:empty){margin-right:auto}
.tbar{display:block;min-width:0}
.tbar .meter{display:block}
.hub-cards{margin-bottom:12px}
.btn svg{width:16px;height:16px;flex:none}
.btn[aria-current="page"]{border-color:var(--ink)}
.hub-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.channel,.mini{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;text-decoration:none;min-width:0;transition:border-color .15s,box-shadow .15s}
.channel:hover,.mini:hover{border-color:var(--acc-line);box-shadow:var(--shadow)}
.channel .logo{width:56px;height:56px}
.channel .t,.mini .t{flex:1;min-width:0;display:grid;gap:3px}
.channel b,.mini b{font-size:16px}
.channel small,.mini small{color:var(--muted);font-size:13.5px}
.mini .meter{margin-top:6px}
.go{font-weight:600;font-size:14px;white-space:nowrap;color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-left:6px}
.kpi .l{font-size:13px;color:var(--muted)}
.ttable{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1.6fr);align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--rule);text-decoration:none;color:inherit}
.trow:first-child{border-top:0}
a.trow:hover{background:var(--acc-soft)}
.trow.thead{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:10px;background:var(--card-2)}
.trow.group{background:var(--card-2);padding-block:9px;grid-template-columns:1fr}
.trow.group .tname{font-size:13px;font-weight:700;letter-spacing:.02em}
.tname{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.tname > span{min-width:0;overflow-wrap:anywhere}
.chip{width:10px;height:10px;border-radius:3px;background:var(--acc);flex:none}
.tmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tnum{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;white-space:nowrap}
.tnum b{color:var(--ink);font-weight:500}
.tnum .sm,.tnote{font-style:normal}
.tnum .sm{display:none}
.tnote{font-size:13px;color:var(--muted)}
.acc-good{color:var(--ok)!important}
.acc-low{color:var(--bad)!important}
.trow.soon .tname{color:var(--muted);font-weight:500}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.weak{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.site-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:36px;padding-top:18px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
.site-foot .logo{width:28px;height:28px}
.site-foot a{color:var(--ink);font-weight:600}
:root{--flag:#B45309;--flag-soft:#FDF1DC;--exbar:#1F3B57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--flag:#F2B54B;--flag-soft:#33260F;--exbar:#16293C}}
:root[data-theme="dark"]{--flag:#F2B54B;--flag-soft:#33260F;--exbar:#16293C}
.hub-cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.links{display:flex;gap:8px 20px;flex-wrap:wrap;margin:4px 0 0;font-weight:600;font-size:14px}
.links a{color:var(--ink)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.qtop .qnum{margin:0}
.flag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.flag svg{width:15px;height:15px;flex:none}
.flag[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}
.cell{position:relative}
.cell.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.legend .l-fl{background:var(--flag);border-color:var(--flag);border-radius:50%}
li.is-sel .opt{border-color:var(--ink);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--ink)}
li.is-sel .let{background:var(--ink);border-color:var(--ink);color:var(--card)}
li.is-sel .mk{color:var(--ink)}
.cell.done{background:var(--card-2);border-color:var(--ink);color:var(--ink)}
li.is-x .otxt{text-decoration:line-through;opacity:.45}
li.is-x .let{opacity:.45}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.xbtn{width:36px;border:1px solid var(--rule);background:var(--card);border-radius:10px;cursor:pointer;color:var(--muted);font-size:14px}
.xbtn:hover{border-color:var(--ink);color:var(--ink)}
.btn.warn,.btn.solid.warn{background:var(--card);color:var(--bad);border-color:var(--bad)}
.mocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.mock{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--acc-line);border-left:4px solid var(--acc);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.mocks .mock{margin-bottom:0}
.mock .t{flex:1;min-width:0;display:grid;gap:3px}
.mock .eyebrow{color:var(--acc)}
.mock b{font-family:var(--f-display);font-weight:400;font-size:21px}
.mock small{color:var(--muted);font-size:13.5px}
.builder{display:grid;gap:12px}
.bstep{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.bstep h3{font-size:16px;font-weight:700}
.bsys{display:grid;gap:10px}
.bgroup{border:1px solid var(--rule);border-radius:12px;padding:8px 14px 12px;margin:0;min-width:0}
.bgroup legend{padding:0 6px;font-weight:700}
.bgroup legend label,.bsub{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.bsubs{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:4px}
.bsub .mono{font-size:12px;color:var(--muted)}
.builder input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.bnote{font-size:13px;color:var(--muted);margin:0}
.bgo{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--acc-line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);z-index:3}
.bgo p{margin:0;min-width:0;flex:1}
.bwarn{color:var(--bad)}
.seg button .mono{font-size:11px;opacity:.75;margin-left:3px}
.flist{display:grid;gap:10px}
.file.flagrow{border-style:dashed}
.ic.flagic{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.ic.flagic svg,.flagcount svg{width:14px;height:14px}
.flagcount{display:inline-flex;align-items:center;gap:6px;color:var(--flag)}
.fitem{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.fitem p{margin:0;max-width:75ch}
.fmeta{display:flex;gap:12px;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.facts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.exhead{display:grid;gap:4px;padding-block:28px 0}
.exhead h2{font-size:clamp(22px,3.4vw,30px)}
.exam{background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden;margin-top:16px;box-shadow:var(--shadow);scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.exbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--exbar);color:#fff;padding:10px 14px}
.exitem{font-weight:700;font-variant-numeric:tabular-nums}
.exbar .btn,.flag.onbar{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.32);color:#fff}
.exbar .btn:hover{border-color:#fff}
.flag.onbar[aria-pressed="true"]{background:#F2B54B;border-color:#F2B54B;color:#1F2A33}
.exarrows{display:inline-flex;gap:6px}
.exarrows .btn{padding:6px 12px}
.exclock{margin-left:auto;display:grid;justify-items:end;line-height:1.15}
.exclock small{font-size:11px;opacity:.75;letter-spacing:.04em;text-transform:uppercase}
.exclock b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.exclock.low b{color:#FFB39C}
.exbar .btn.warn{background:#fff;color:#B42318;border-color:#fff}
.exbody{display:grid;grid-template-columns:200px minmax(0,1fr)}
.exnav{border-right:1px solid var(--rule);padding:12px;background:var(--card-2)}
.exnav-h{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 8px}
.exgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.exgrid .cell{font-size:11.5px}
.exq{min-width:0}
.exnav-sm{display:none}
@media (max-width:760px){
  .exbody{grid-template-columns:minmax(0,1fr)}
  .exnav{display:none}
  .exnav-sm{display:block}
}
@media (max-width:640px){
  .trow{grid-template-columns:minmax(0,1fr);gap:8px}
  .trow.thead{display:none}
  .tmeta{display:flex;flex-wrap:wrap;gap:4px 16px}
  .tnum{text-align:left}
  .tnum .sm{display:inline}
}
@media (max-width:560px){
  .crumbs{order:9;flex-basis:100%}
  .brand .wordmark{display:none}
  .sync .lbl{display:none}
  .btn.yt .ytl,.btn.sharebtn .shl{display:none}
  .exarrows{display:none}
  .exend{margin-left:auto}
  .exclock{order:5;flex-basis:100%;display:flex;justify-content:space-between;align-items:baseline;margin-left:0;border-top:1px solid rgba(255,255,255,.18);padding-top:6px}
  .bar .btn{padding:7px 11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
(function(){
"use strict";
const REG = JSON.parse(document.getElementById('registry').textContent);
const BASE = REG.base || "";
const $app = document.getElementById('app');
const $crumbs = document.getElementById('crumbs');
const SYS = {}, SUBJ = {};
REG.systems.forEach(s => { SYS[s.id] = s; s.subjects.forEach(x => { x.sys = s; SUBJ[x.id] = x; }); });
const WORDS = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];
const LET = "ABCDE";

/* ---------- storage (per browser, optional) ---------- */
const MEM = {};
const store = {
  get(k, d){ if (k in MEM) return MEM[k] === null ? d : JSON.parse(MEM[k]); try { const v = localStorage.getItem(k); if (v) { MEM[k] = v; return JSON.parse(v); } } catch(e){} return d; },
  set(k, v){ const j = JSON.stringify(v); MEM[k] = j; try { localStorage.setItem(k, j); } catch(e){} },
  del(k){ MEM[k] = null; try { localStorage.removeItem(k); } catch(e){} }
};
const skey = id => 'famcq:v1:' + id;
function prog(id){
  const st = store.get(skey(id), {a:{}}); const v = Object.values(st.a || {});
  return { answered: v.length, correct: v.filter(x => x[1]).length };
}
function sysProg(sys){
  let a=0,c=0,t=0,live=0,n=0,plan=0;
  sys.subjects.forEach(s => { plan += (s.planned || s.count); if (s.ready){ const p = prog(s.id); a+=p.answered; c+=p.correct; t+=s.count; live++; } if (s.ext){ t+=s.count; live++; } n++; });
  return {answered:a, correct:c, total:t, live, n, plan};
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt = s => esc(s).replace(/\n/g,'<br>');
const pad = n => String(n).padStart(2,'0');
const nf = n => n.toLocaleString('en-US');
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const tintStyle = c => `style="--sys:${c}"`;
const linkFor = id => (BASE ? BASE + '#' + id : '');
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
function copy(text){
  if (!text){ toast('Link not available yet'); return; }
  const done = () => toast('Link copied');
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text)); } catch(e){ fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); toast(ok ? 'Link copied' : text);
}
function waLink(title, id){ const u = linkFor(id); return 'https://wa.me/?text=' + encodeURIComponent(title + ' — practise with me: ' + (u || '')); }
function setTheme(c){ document.getElementById('bar').style.setProperty('--sys', c || '#2D4A9A'); document.body.style.setProperty('--sys', c || '#2D4A9A'); }
function crumbs(parts){
  $crumbs.innerHTML = parts.map((p,i) => i === parts.length-1 ? `<span class="here">${esc(p[0])}</span>` : `<a href="#${p[1]}">${esc(p[0])}</a><span class="sep">/</span>`).join('');
}
function totals(){
  let live=0,q=0,n=0,ans=0; REG.systems.forEach(s => s.subjects.forEach(x => { n++; if (x.ready || x.ext){ live++; q+=x.count; } if (x.ready) ans += prog(x.id).answered; }));
  return {live,q,n,ans};
}

/* ---------- views ---------- */
function folderCard(s){
  const p = sysProg(s); const dim = p.live === 0;
  return `<a class="folder tint${dim?' dim':''}" ${tintStyle(s.color)} href="#${s.id}">
    <span class="name">${esc(s.name)}</span>
    <span class="sub">${s.subjects.map(x=>esc(x.name)).join(' · ')}</span>
    <span class="ff">
      <span class="row"><span>${p.n} subfolders</span><span>pp. ${s.pages[0]}–${s.pages[1]}</span></span>
      <span class="meter" aria-hidden="true"><i style="width:${pct(p.total,p.plan)}%"></i></span>
      <span class="row"><span>${nf(p.total)} / ${nf(p.plan)} Qs live</span>${dim ? '<span class="pill">Soon</span>' : `<span class="pill live">${p.answered ? nf(p.answered)+' done' : 'Open'}</span>`}</span>
    </span></a>`;
}
function hub(){
  setTheme('#2D4A9A'); $crumbs.innerHTML = '';
  document.title = 'First Aid MCQ Bank';
  const t = totals(); const last = store.get('famcq:v1:last', null);
  const lastS = last && SUBJ[last.id] && SUBJ[last.id].ready ? SUBJ[last.id] : null;
  const groups = [['systems','Section III','High-Yield Organ Systems'],['general','Section II','High-Yield General Principles']];
  $app.innerHTML = `
  <section class="hero">
    <p class="eyebrow">Medical Companion · USMLE Step 1 · First Aid 2026</p>
    <h1>First Aid MCQ Bank</h1>
    <p class="lead">Exam-style questions for every section of First Aid. Open a system folder, pick a subject, and answer in rounds of 20. Every option comes with an explanation and the page to revise.</p>
    <div class="stats"><span><b>${nf(t.q)}</b> questions live</span><span><b>${t.live}</b> of ${t.n} subjects ready</span><span><b>${nf(t.ans)}</b> answered by you</span></div>
  </section>
  <div class="hub-cards">${channelCard()}${miniProgress()}${testCard()}${flagCard()}</div>
  ${lastS ? `<a class="continue tint" ${tintStyle(lastS.sys.color)} href="#${lastS.id}"><span class="k">Continue</span><span class="t">${esc(lastS.sys.name)} · ${esc(lastS.name)} — Round ${pad(last.r+1)}, Q${last.q+1}</span><span class="btn solid">Resume →</span></a>` : ''}
  ${groups.map(([g,sec,label]) => { const list = REG.systems.filter(s => s.group === g); const q = list.reduce((a,s)=>a+s.subjects.reduce((b,x)=>b+(x.planned||x.count),0),0);
    return `<div class="section-head"><h2>${label}</h2><span class="meta">${sec} · ${list.length} folders · ${nf(q)} questions planned</span></div>
    <div class="shelf">${list.map(folderCard).join('')}</div>`; }).join('')}
  <p class="about">Original practice questions written from First Aid for the USMLE Step 1 2026. Page numbers refer to that edition. Your progress is saved in this browser. Sign-in with Google is coming soon, so your progress can follow you to every device. Educational revision, not an official exam question bank.</p>`;
}
function folder(s){
  setTheme(s.color); crumbs([['First Aid','' ],[s.name, s.id]]);
  document.title = s.name + ' · First Aid MCQ Bank';
  const p = sysProg(s);
  $app.innerHTML = `
  <section class="hero tint" ${tintStyle(s.color)}>
    <p class="eyebrow">Folder · ${s.group==='systems'?'Organ system':'General principles'} · First Aid pp. ${s.pages[0]}–${s.pages[1]}</p>
    <h1>${esc(s.name)}</h1>
    <div class="stats"><span><b>${p.live}</b> of ${p.n} subfolders live</span><span><b>${nf(p.total)}</b> of ${nf(p.plan)} questions live</span><span><b>${nf(p.answered)}</b> answered · <b>${nf(p.correct)}</b> correct</span></div>
  </section>
  ${mockCard(s)}
  <div class="files tint" ${tintStyle(s.color)}>${s.subjects.map(x => fileRow(x)).join('')}${flaggedRow(s)}</div>
  <div class="foot"><a class="btn" href="#">← All folders</a><button class="btn" type="button" data-share="${s.id}" data-title="${esc(s.name)} MCQs">Copy folder link</button></div>`;
}
function fileRow(x){

/* ---------- progress tracker ---------- */
const YT = 'https://www.youtube.com/@medicalcompaniondoctor';
const accTxt = (c,a) => a ? pct(c,a) + '%' : '—';
const accCls = (c,a) => !a ? '' : (pct(c,a) >= 80 ? 'acc-good' : pct(c,a) < 60 ? 'acc-low' : '');
function subjStats(x){
  const planned = x.planned || x.count;
  if (x.ext) return {ext:true, total:x.count, answered:0, correct:0, rounds:Math.ceil(x.count/20), roundsDone:0};
  if (!x.ready) return {soon:true, total:planned, answered:0, correct:0, rounds:Math.ceil(planned/20), roundsDone:0};
  const st = store.get(skey(x.id), {a:{}}); const a = st.a || {};
  const rq = x.rq || Array(Math.ceil(x.count/20)).fill(20);
  const per = rq.map(() => 0); let answered = 0, correct = 0;
  Object.keys(a).forEach(k => { const r = +k.split('-')[0]; if (per[r] != null){ per[r]++; answered++; if (a[k] && a[k][1]) correct++; } });
  return {total:x.count, answered, correct, rounds:rq.length, roundsDone: per.filter((n,i) => n >= rq[i]).length};
}
function sysStats(s){
  const o = {total:0, answered:0, correct:0, rounds:0, roundsDone:0, live:0, started:0, n:s.subjects.length};
  s.subjects.forEach(x => { if (!x.ready) return; const v = subjStats(x); o.total+=v.total; o.answered+=v.answered; o.correct+=v.correct; o.rounds+=v.rounds; o.roundsDone+=v.roundsDone; o.live++; if (v.answered) o.started++; });
  return o;
}
function allStats(){
  const A = {total:0, answered:0, correct:0, rounds:0, roundsDone:0, live:0, started:0, n:0};
  REG.systems.forEach(s => { const v = sysStats(s); Object.keys(A).forEach(k => A[k] += v[k]); });
  return A;
}

}
function trow(o){

/* ---------- quiz ---------- */
const cache = {};
let Q = null; // {s, data, st, r, q, summary}
function loadData(s){
  if (cache[s.id]) return Promise.resolve(cache[s.id]);
  return fetch(s.id + '.json?v=' + (s.v || '1')).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => (cache[s.id] = d));
}
function quiz(s){
  setTheme(s.sys.color); crumbs([['First Aid',''],[s.sys.name, s.sys.id],[s.name, s.id]]);
  document.title = s.sys.name + ' ' + s.name + ' · First Aid MCQ Bank';
  if (s.ext){
    $app.innerHTML = `<div class="empty tint" ${tintStyle(s.sys.color)}><h2>${esc(s.sys.name)} ${esc(s.name)}</h2><p>This subject lives on its own site.</p><a class="btn solid" href="${esc(s.ext)}" target="_blank" rel="noopener">Open ${esc(s.name)} ↗</a><a class="btn" href="#${s.sys.id}">← Back to ${esc(s.sys.name)}</a></div>`; return;
  }
  if (!s.ready){
    $app.innerHTML = `<div class="empty tint" ${tintStyle(s.sys.color)}><h2>${esc(s.sys.name)} ${esc(s.name)}</h2><p>${s.count} questions from First Aid pp. ${s.pages[0]}–${s.pages[1]} are being written. This folder unlocks at the same link when they're ready.</p><a class="btn" href="#${s.sys.id}">← Back to ${esc(s.sys.name)}</a></div>`; return;
  }
  $app.innerHTML = '<p class="loading">Loading questions…</p>';
  loadData(s).then(data => {
    const st = store.get(skey(s.id), {a:{}, last:null}); st.a = st.a || {};
    let r = 0, q = 0;
    if (st.last && data.rounds[st.last.r]){ r = st.last.r; q = Math.min(st.last.q, data.rounds[r].q.length-1); }
    else { const fr = data.rounds.findIndex((R,ri) => R.q.some((_,qi) => !st.a[ri+'-'+qi])); if (fr > 0) r = fr; }
    Q = {s, data, st, r, q, summary:false};
    renderQuiz();
  }).catch(() => {
    $app.innerHTML = `<div class="empty"><h2>Questions didn't load</h2><p>Check your connection, then try again.</p><button class="btn solid" type="button" id="retry">Try again</button></div>`;
    document.getElementById('retry').onclick = () => quiz(s);
  });
}
function roundStats(ri){
  const R = Q.data.rounds[ri]; let a=0,c=0;
  R.q.forEach((_,qi) => { const v = Q.st.a[ri+'-'+qi]; if (v){ a++; if (v[1]) c++; } });
  return {a, c, n:R.q.length};
}
function quizTotals(){
  let a=0,c=0,n=0,done=0;
  Q.data.rounds.forEach((R,ri) => { const x = roundStats(ri); a+=x.a; c+=x.c; n+=x.n; if (x.a===x.n) done++; });
  return {a,c,n,done};
}
function save(){
  const now = Date.now();
  Q.st.last = {r:Q.r, q:Q.q, t:now}; store.set(skey(Q.s.id), Q.st);
  store.set('famcq:v1:last', {id:Q.s.id, r:Q.r, q:Q.q, t:now});
  Sync.queue(Q.s.sys.id, 2500);
}

  </div>`;
  const rs = document.getElementById('restart'); let armed = false, tm;

    clearTimeout(tm); Q.st = {a:{}, last:null, rv:Date.now(), fl:Q.st.fl || {}}; store.set(skey(s.id), Q.st); Sync.queue(s.sys.id, 0); Q.r = 0; Q.q = 0; Q.summary = false; renderQuiz(); toast('Attempt restarted');
  };

function drawRounds(){
  const el = document.getElementById('rounds'); if (!el) return;

    return `<button class="round" type="button" data-round="${ri}" aria-current="${ri===Q.r}">

  const T = quizTotals();

function drawPanel(scroll){
  const el = document.getElementById('question-panel'); const R = Q.data.rounds[Q.r]; const x = roundStats(Q.r);
  const mapOpen = store.get('famcq:v1:mapOpen', false);

  <details class="qmap" id="qmap"${mapOpen?' open':''}><summary>Question map</summary>

    <p class="legend"><span><i class="l-ok"></i>Correct</span><span><i class="l-bad"></i>To review</span><span><i></i>Unanswered</span><span><i class="l-fl"></i>Flagged</span></p></details>`;
  if (Q.summary){

    el.innerHTML = head + `<div class="summary">

      ${unans.length ? `<p style="margin:0;color:var(--muted)">${unans.length} still unanswered.</p>` : ''}

  } else {

        return `<li class="${cls}"><button class="opt" type="button" data-opt="${i}"${ans?' disabled':''}><span class="let">${LET[i]}</span><span class="otxt">${fmt(o)}</span><span class="mk">${mk}</span></button><div class="why">${fmt(item.e[i])}</div></li>`; }).join('')}</ol>

  document.getElementById('qmap').addEventListener('toggle', e => store.set('famcq:v1:mapOpen', e.target.open));

}
function answer(i){
  if (!Q || Q.summary) return; const item = Q.data.rounds[Q.r].q[Q.q]; const k = Q.r+'-'+Q.q;
  if (Q.st.a[k]) return;
  Q.st.a[k] = [i, i===item.a ? 1 : 0]; save(); Sync.queue(Q.s.sys.id, 800); drawRounds(); drawPanel(false);
}
function go(d){
  const R = Q.data.rounds[Q.r];
  if (Q.summary){ if (d<0){ Q.summary=false; Q.q=R.q.length-1; } else if (Q.r+1 < Q.data.rounds.length){ Q.summary=false; Q.r++; Q.q=0; } else { location.hash = Q.s.sys.id; return; } }
  else if (d>0 && Q.q === R.q.length-1){ Q.summary = true; }
  else { Q.q = Math.max(0, Math.min(R.q.length-1, Q.q+d)); }
  save(); drawRounds(); drawPanel(true);
}

function testRun(){

function tick(){
  if (!TEST || TEST.done || location.hash.slice(1) !== 'test'){ clearInterval(tTimer); return; }
  if (TEST.timed && elapsed() >= TEST.limit){ finishTest(true); return; }
  const el = document.getElementById('tclock'); if (el) el.textContent = clockTxt();

}
function endArm(el){
  const left = TEST.items.length - Object.keys(TEST.ans).length;
  if (!left && el.classList.contains('solid')) return finishTest(false);
  if (!el.dataset.armed){
    el.dataset.armed = '1'; el.dataset.label = el.innerHTML; el.textContent = left ? `End with ${left} unanswered? Tap again` : 'Tap again to end and score'; el.classList.add('warn');
    setTimeout(() => { if (el.isConnected && el.dataset.armed){ delete el.dataset.armed; el.innerHTML = el.dataset.label; el.classList.remove('warn'); } }, 4000); return;
  }

}
function finishTest(timeUp){
  fold(); TEST.done = true; TEST.rv = 0;
  let c = 0; const touched = new Set();
  TEST.items.forEach((it, i) => { const item = itemQ(it); const v = TEST.ans[i]; if (v == null || !item) return; const ok = v === item.a; if (ok) c++;
    const st = store.get(skey(it.s), {a:{}}); st.a = st.a || {}; if (!st.a[it.k]){ st.a[it.k] = [v, ok ? 1 : 0]; store.set(skey(it.s), st); touched.add(SUBJ[it.s].sys.id); } });
  TEST.c = c; saveTest();
  const hist = store.get('famcq:v1:tests', []).filter(h => h.id !== TEST.id);
  hist.unshift({id: TEST.id, at: TEST.at, label: TEST.label, mock: TEST.mock, n: TEST.items.length, c, used: Math.round(TEST.used), timed: TEST.timed, mode: TEST.mode});
  store.set('famcq:v1:tests', hist.slice(0, 40));
  touched.forEach(sid => Sync.queue(sid, 500)); Sync.queueTests();

  window.scrollTo(0, 0); renderTest(false);
}
function testResults(){
  clearInterval(tTimer);

  const per = {}; TEST.items.forEach((it, j) => { const p = per[it.s] = per[it.s] || {n: 0, c: 0}; p.n++; const item = itemQ(it); if (item && TEST.ans[j] === item.a) p.c++; });

  <section class="hero">

    <h1>${esc(TEST.label)}</h1>
    <div class="kpis">

      ${mh.length > 1 ? `<div class="kpi"><span class="v">${Math.max(...mh.map(t => pct(t.c, t.n)))}%</span><span class="l">Best of ${mh.length} ${esc(SYS[TEST.mock].name)} mocks</span></div>` : ''}
    </div>
  </section>
  <div class="section-head"><h2>By subject</h2><span class="meta">Where you lost marks</span></div>
  <div class="ttable">${Object.keys(per).map(id => { const p = per[id], s = SUBJ[id]; return `<div class="trow tint" ${tintStyle(s.sys.color)}><span class="tname"><i class="chip" aria-hidden="true"></i><span>${esc(s.sys.name)} · ${esc(s.name)}</span></span><span class="tbar"><span class="meter" aria-hidden="true"><i style="width:${pct(p.c, p.n)}%"></i></span></span><span class="tmeta"><span class="tnum"><b>${p.c}</b> / ${p.n}<i class="sm"> correct</i></span><span class="tnum ${accP(pct(p.c, p.n))}">${pct(p.c, p.n)}%</span><span class="tnum"></span></span></div>`; }).join('')}</div>
  <div class="section-head"><h2>Review answers</h2><span class="meta">Tap a number to see its explanation</span></div>
  <section class="panel tint" ${tintStyle(x.sys.color)} id="question-panel">
    <div class="qmap"><div class="grid">${cells}</div><p class="legend"><span><i class="l-ok"></i>Correct</span><span><i class="l-bad"></i>Incorrect</span><span><i></i>Blank</span><span><i class="l-fl"></i>Flagged</span></p></div>
    <div class="qbody answered">
      <div class="qtop"><p class="qnum">QUESTION ${i + 1} OF ${N}</p>${flagBtn(it.s, it.k)}</div>
      <p class="stem">${fmt(item.s)}</p>
      ${optList(item, sel, true, [], 'none')}
      ${feedbackBox(item, sel, x)}
    </div>
    <nav class="qnav"><button class="btn" type="button" data-t="rv:${i - 1}"${i === 0 ? ' disabled' : ''}>← Previous</button><button class="btn solid" type="button" data-t="rv:${i + 1}"${i === N - 1 ? ' disabled' : ''}>Next →</button></nav>
  </section>
  <div class="foot"><button class="btn" type="button" data-t="new">Back to tests</button>${TEST.mock ? `<button class="btn" type="button" data-t="mock:${TEST.mock}">New ${esc(SYS[TEST.mock].name)} mock</button>` : ''}${wrong ? `<button class="btn solid" type="button" data-t="retake">Retake the ${wrong} you missed →</button>` : ''}</div>`;
}
function testAction(a, el){
  const p = a.split(':'), cmd = p[0];
  if (cmd === 'cfg'){ const c = cfg(); c[p[1]] = p[1] === 'n' ? +p[2] : p[1] === 'timed' ? p[2] === '1' : p[2]; setCfg(c); const y = window.scrollY; testBuilder(); window.scrollTo(0, y); return; }
  if (cmd === 'start') return armOr(el, () => { const [it, l] = customItems(); startTest(it, l); });
  if (cmd === 'mock') return armOr(el, () => startTest(mockItems(p[1]), SYS[p[1]].name + ' mock exam', {mode: 'exam', timed: true, mock: p[1]}));
  if (cmd === 'flagtest') return armOr(el, () => { const sy = p[1] && SYS[p[1]]; const ids = sy ? sy.subjects.filter(x => x.ready).map(x => x.id) : readyIds(); const items = []; ids.forEach(id => flaggedKeys(id).forEach(k => items.push({s: id, k}))); startTest(shuffle(items), sy ? sy.name + ' · flagged questions' : 'Flagged questions', {mode: 'tutor', timed: false}); });
  if (cmd === 'open'){ const id = p[1], k = p[2]; const [r, q] = k.split('-').map(Number); const st = store.get(skey(id), {a:{}}); st.last = {r, q, t: Date.now()}; store.set(skey(id), st); location.hash = id; return; }
  if (cmd === 'reload') return testView();
  if (!TEST) return;
  if (cmd === 'new'){ TEST = null; saveTest(); window.scrollTo(0, 0); testView(); return; }
  if (cmd === 'retake'){ const items = TEST.items.filter((t2, j) => TEST.ans[j] !== itemQ(t2).a).map(t2 => ({s: t2.s, k: t2.k})); startTest(shuffle(items), 'Retake · ' + TEST.label.replace(/^Retake · /, ''), {mode: TEST.mode, timed: TEST.timed}); return; }
  if (cmd === 'rv'){ TEST.rv = +p[1]; saveTest(); renderTest(true, true); return; }
  if (TEST.done) return;
  if (cmd === 'opt'){ pickTest(+p[1]); return; }
  if (cmd === 'x'){ const j = +p[1]; TEST.x = TEST.x || {}; const xs = TEST.x[TEST.cur] = TEST.x[TEST.cur] || []; const at = xs.indexOf(j); if (at >= 0) xs.splice(at, 1); else { xs.push(j); if (TEST.ans[TEST.cur] === j && TEST.mode === 'exam') delete TEST.ans[TEST.cur]; } saveTest(); renderTest(true); return; }

  if (cmd === 'prev' || cmd === 'next'){ TEST.cur = Math.max(0, Math.min(TEST.items.length - 1, TEST.cur + (cmd === 'next' ? 1 : -1))); saveTest(); renderTest(true, true); return; }
  if (cmd === 'end') return endArm(el);
}
function pickTest(j){
  const i = TEST.cur; if (TEST.mode === 'tutor' && TEST.ans[i] != null) return;
  if (TEST.x && TEST.x[i]){ const at = TEST.x[i].indexOf(j); if (at >= 0) TEST.x[i].splice(at, 1); }
  TEST.ans[i] = j; saveTest(); renderTest(true);
}
function testCard(){ const run = TEST && !TEST.done; return `<a class="mini tint" href="#test"><span class="t"><b>Tests &amp; mock exams</b><small>${run ? `Test in progress · ${Object.keys(TEST.ans).length} of ${TEST.items.length} answered` : 'USMLE-style system blocks, or your own timed mix.'}</small></span><span class="go">${run ? 'Resume →' : 'Start →'}</span></a>`; }
function flagCard(){ const n = flagCount(); return `<a class="mini tint" href="#flagged"><span class="t"><b>Flagged questions</b><small>${n ? `${n} saved for review` : 'Flag any question to save it here.'}</small></span><span class="go">${n ? 'Review →' : 'Open →'}</span></a>`; }
document.addEventListener('click', e => {
  const f = e.target.closest('[data-flag]'); if (f){ toggleFlag(f.dataset.flag); return; }

document.addEventListener('keydown', e => {
  if (location.hash.slice(1) !== 'test' || !TEST || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (TEST.done){ if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ const N = TEST.items.length; TEST.rv = Math.max(0, Math.min(N - 1, (TEST.rv || 0) + (e.key === 'ArrowRight' ? 1 : -1))); saveTest(); renderTest(true, true); e.preventDefault(); } return; }
  const idx = 'abcde'.indexOf(k) >= 0 ? 'abcde'.indexOf(k) : '12345'.indexOf(k);
  if (idx >= 0 && k.length === 1){ pickTest(idx); e.preventDefault(); }
  else if (e.key === 'ArrowRight'){ testAction('next'); e.preventDefault(); }

/* ---------- cross-device sync (signed-in Claude accounts) ---------- */
const Sync = (function(){
  let col = null, ready = false, timer = null, testsDirty = false; const pending = new Set(), busy = {};
  const el = document.getElementById('sync');
  function status(st){
    const txt = {local:'Saved here', syncing:'Syncing…', synced:'Synced', error:'Sync paused'}[st];
    const tip = {local:'Progress is saved in this browser only', syncing:'Saving to your Claude account', synced:'Progress is saved to your Claude account and follows you to every device where you are signed in', error:'Could not reach your account; progress is still saved in this browser'}[st];
    el.dataset.state = st; el.querySelector('.lbl').textContent = txt; el.title = tip;
  }
  function entry(id){ const st = store.get(skey(id), null); return st ? {a: st.a || {}, last: st.last || null, rv: st.rv || 0, fl: st.fl || {}} : null; }
  function sysDoc(sid){
    const out = {};
    SYS[sid].subjects.forEach(x => { const e = entry(x.id); if (e && (Object.keys(e.a).length || e.last || e.rv || Object.keys(e.fl).length)) out[x.id] = e; });
    return {s: out, u: Date.now()};
  }
  function merge(id, R){
    const L = entry(id) || {a:{}, last:null, rv:0}; let M;
    const lrv = L.rv || 0, rrv = R.rv || 0;
    if (rrv > lrv) M = {a: Object.assign({}, R.a || {}), rv: rrv};
    else if (lrv > rrv) M = {a: Object.assign({}, L.a), rv: lrv};
    else M = {a: Object.assign({}, L.a, R.a || {}), rv: lrv};
    const lt = (L.last && L.last.t) || 0, rt = (R.last && R.last.t) || 0;
    M.last = rt > lt ? R.last : L.last;
    const lf = L.fl || {}, rf = R.fl || {}; M.fl = Object.assign({}, lf);
    Object.keys(rf).forEach(k => { if (!M.fl[k] || (rf[k][1] || 0) > (M.fl[k][1] || 0)) M.fl[k] = rf[k]; });
    const changedLocal = JSON.stringify(M.a) !== JSON.stringify(L.a) || M.rv !== lrv || M.last !== L.last || JSON.stringify(M.fl) !== JSON.stringify(lf);
    const changedRemote = JSON.stringify(M.a) !== JSON.stringify(R.a || {}) || M.rv !== rrv || JSON.stringify(M.fl) !== JSON.stringify(rf);
    if (changedLocal) store.set(skey(id), M);
    return {changedLocal, changedRemote};
  }
  async function pull(){
    if (!col) return;
    status('syncing');
    try {
      const snap = await col.get(); let anyLocal = false, sawTests = false; const dirty = new Set(); const seen = new Set();
      snap.docs.forEach(d => {
        const body = d.data() || {};
        if (d.id === 'meta'){ const ml = body.last, ll = store.get('famcq:v1:last', null); if (ml && (!ll || (ml.t||0) > (ll.t||0))) store.set('famcq:v1:last', ml); return; }
        if (d.id === 'tests'){ sawTests = true; const L = store.get('famcq:v1:tests', []), ids = new Set(L.map(h => h.id)); const add = (body.list || []).filter(h => h && !ids.has(h.id));
          const M = L.concat(add).sort((p, q) => q.at - p.at).slice(0, 40); if (add.length){ store.set('famcq:v1:tests', M); anyLocal = true; } if (M.length > (body.list || []).length) testsDirty = true; return; }
        if (!d.id.startsWith('sys-')) return; const sid = d.id.slice(4); if (!SYS[sid]) return; seen.add(sid);
        Object.entries(body.s || {}).forEach(([id, R]) => { if (!SUBJ[id]) return; const r = merge(id, R); if (r.changedLocal) anyLocal = true; if (r.changedRemote) dirty.add(sid); });
        SYS[sid].subjects.forEach(x => { if (!(body.s || {})[x.id] && entry(x.id)) dirty.add(sid); });
      });
      REG.systems.forEach(sy => { if (!seen.has(sy.id) && sy.subjects.some(x => entry(x.id))) dirty.add(sy.id); });
      status('synced');
      if (!sawTests && store.get('famcq:v1:tests', []).length) testsDirty = true;
      dirty.forEach(sid => queue(sid, 0)); if (testsDirty) queueTests();
      if (anyLocal) refresh();
    } catch(e){ status('error'); }
  }
  function refresh(){
    if (Q){ const st = store.get(skey(Q.s.id), {a:{}}); Q.st = Object.assign({a:{}}, st); drawRounds(); drawPanel(false); }
    else { const y = window.scrollY; route(true); window.scrollTo(0, y); }
  }
  function queueTests(){ if (!ready) return; testsDirty = true; clearTimeout(timer); timer = setTimeout(flush, 800); }
  function queue(sid, delay){
    if (!ready) return; pending.add(sid); clearTimeout(timer); timer = setTimeout(flush, delay == null ? 1500 : delay);
  }
  async function flush(){
    const list = [...pending]; pending.clear(); if (!list.length && !testsDirty) return; status('syncing');
    let failed = false;
    for (const sid of list){
      if (busy[sid]){ pending.add(sid); continue; }
      busy[sid] = true;
      try { await col.doc('sys-' + sid).set(sysDoc(sid)); }
      catch(e){ failed = true; if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')){ ready = false; col = null; status('local'); busy[sid] = false; return; } pending.add(sid); }
      busy[sid] = false;
    }
    try { const last = store.get('famcq:v1:last', null); if (last && col) await col.doc('meta').set({last}); } catch(e){}
    if (testsDirty && col){ testsDirty = false; try { await col.doc('tests').set({list: store.get('famcq:v1:tests', []).slice(0, 40)}); } catch(e){ testsDirty = true; failed = true; } }
    if (pending.size || testsDirty){ timer = setTimeout(flush, failed ? 6000 : 1500); }
    status(failed ? 'error' : 'synced');
  }
  async function init(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      let canWrite = null; try { canWrite = await user.can('data.write'); } catch(e){}
      if (canWrite === false) return;
      const uid = await user.id(); if (!uid) return;
      col = db.collection('data/users/' + uid); ready = true;
      await pull();
      let lastPull = Date.now();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastPull > 20000){ lastPull = Date.now(); pull(); } });
    } catch(e){ status('local'); }
  }
  return {init, queue, queueTests};
})();

function route(keep){
  const h = decodeURIComponent(location.hash.slice(1));
  Q = null; fold();
  if (SUBJ[h]) quiz(SUBJ[h]); else if (SYS[h]) folder(SYS[h]); else if (h === 'progress') progressView(); else if (h === 'test') testView(keep); else if (h === 'flagged') flaggedView(keep); else if (h.startsWith('flagged-') && SYS[h.slice(8)]) flaggedView(keep, h.slice(8)); else hub();
  [['navProgress','progress'],['navTest','test']].forEach(([id, r]) => { const n = document.getElementById(id); if (h === r) n.setAttribute('aria-current','page'); else n.removeAttribute('aria-current'); });
  if (!keep) window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => route());
route();
Sync.init();
})();
